name: ML CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  train-and-evaluate:
    name: Train and evaluate model
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Train model
        run: python src/train.py

      - name: Enforce model quality gate
        run: python src/check_metrics.py --threshold 0.95

      - name: Show metrics in workflow log
        run: cat artifacts/metrics.json

      - name: Upload trained model and metrics
        uses: actions/upload-artifact@v7
        with:
          name: trained-model-${{ github.sha }}
          path: |
            artifacts/model.joblib
            artifacts/metrics.json
          if-no-files-found: error
